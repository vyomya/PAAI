services:
  db:
    image: pgvector/pgvector:pg16
    container_name: paai-db
    environment:
      POSTGRES_USER: paai
      POSTGRES_PASSWORD: paai_local
      POSTGRES_DB: paai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paai"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
